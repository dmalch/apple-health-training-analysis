name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Named `test` because the branch ruleset requires that exact check name.
  # Renaming this job silently stops blocking merges.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: profiles are TOML and tomllib arrived in 3.11.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # The fixtures are synthetic; no health data is involved.
      - run: python -m unittest discover -p 'test_*.py' -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # pyiosbackup alone, not all of requirements-sync.txt: it is the only one of
      # the backup-route extras that is imported from Python, so it is all pyright
      # needs. pymobiledevice3 is invoked as a CLI from sync_health.sh and would
      # drag in eighty packages for nothing.
      - run: pip install "$(grep '^pyiosbackup==' requirements-sync.txt)"
      - run: ruff --version && pyright --version
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: pyright
